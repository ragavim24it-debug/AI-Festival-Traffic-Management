<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#0f172a;
padding-top:20px;
}

.sidebar h2{
color:white;
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:15px 25px;
}

.sidebar a:hover{
background:#2563eb;
}

.main{
margin-left:250px;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
margin-bottom:10px;
}

.card p{
font-size:28px;
color:#2563eb;
font-weight:bold;
}

.chart-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,.1);
margin-top:30px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:30px;
background:white;
}

table th{
background:#2563eb;
color:white;
padding:15px;
}

table td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

.high{
color:red;
font-weight:bold;
}

.medium{
color:orange;
font-weight:bold;
}

.low{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>AI Traffic</h2>

<a href="index.html"><i class="fa fa-home"></i> Home</a>

<a href="#"><i class="fa fa-chart-line"></i> Dashboard</a>

<a href="prediction.html"><i class="fa fa-robot"></i> Prediction</a>

<a href="#"><i class="fa fa-map"></i> Live Map</a>

<a href="#"><i class="fa fa-car"></i> Parking</a>

<a href="#"><i class="fa fa-phone"></i> Contact</a>

</div>

<div class="main">

<h1>Festival Traffic Dashboard</h1>

<br>

<div class="cards">

<div class="card">
<h2>Total Vehicles</h2>
<p>245</p>
</div>

<div class="card">
<h2>Congested Roads</h2>
<p>8</p>
</div>

<div class="card">
<h2>Parking Available</h2>
<p>120</p>
</div>

<div class="card">
<h2>Emergency Alerts</h2>
<p>2</p>
</div>

</div>

<div class="chart-box">

<canvas id="trafficChart"></canvas>

</div>

<table>

<tr>
<th>Road</th>
<th>Vehicles</th>
<th>Status</th>
</tr>

<tr>
<td>Temple Road</td>
<td>245</td>
<td class="high">High</td>
</tr>

<tr>
<td>Main Road</td>
<td>180</td>
<td class="medium">Medium</td>
</tr>

<tr>
<td>Market Road</td>
<td>90</td>
<td class="low">Low</td>
</tr>

</table>

</div>

<script>

const ctx=document.getElementById('trafficChart');

new Chart(ctx,{
type:'bar',
data:{
labels:['Temple Road','Main Road','Market Road','Bus Stand'],
datasets:[{
label:'Vehicles',
data:[245,180,90,150]
}]
}
});

</script>

</body>
</html>
